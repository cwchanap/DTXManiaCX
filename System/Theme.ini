; NX (default) skin theme.
; All keys are optional; the game falls back to built-in (NX-layout) defaults.
; [Section] headers are purely organizational and ignored by SkinTheme.Parse;
; lookup is by bare key, so a key may live under any section (or none).

[Result]
; Numeric values (play % / skill) read charcoal against the NX skill panel's
; bright judgement bars. The code default stays white so third-party skins
; with dark panel art keep readable digits without setting this key.
Result.ValueText=#303030
; The level sits on the panel's dark-blue header band, not the bright bars,
; so it takes a light tone separate from the charcoal row values.
Result.LevelText=#FFFFFF
