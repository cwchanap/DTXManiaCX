name: Release

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (e.g. v1.2.3). Takes precedence over bump.'
        required: false
        type: string
      bump:
        description: 'Version component to bump when generating a release tag.'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# The Monday schedule creates the next patch release only when the default
# branch has advanced since the latest semantic release tag. Manual dispatches
# can create major/minor releases or rebuild an existing explicit tag.

# One release pipeline per tag at a time. Cancel in-flight runs for the same
# tag so release creation and asset uploads do not race.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || format('{0}-{1}', github.event_name, github.run_number) }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare-release:
    name: Prepare release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      target_sha: ${{ steps.release.outputs.target_sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Prepare release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          should_release=true

          latest_semver_tag() {
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
              --jq '.[].ref' |
              sed -nE 's#^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$#v\1#p' |
              sort -V |
              tail -n1
          }

          resolve_tag_sha() {
            local release_tag="$1"
            local qualified_tag="tags/${release_tag}"
            local encoded_ref
            encoded_ref="$(jq -rn --arg v "$qualified_tag" '$v | @uri')"
            gh api \
              -H 'Accept: application/vnd.github.sha' \
              "repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}"
          }

          next_release_tag() {
            local bump="$1"
            local base_version
            base_version="$(latest_semver_tag)"
            base_version="${base_version#v}"
            base_version="${base_version:-0.0.0}"

            local major minor patch
            IFS=. read -r major minor patch <<< "$base_version"
            major=$((10#$major))
            minor=$((10#$minor))
            patch=$((10#$patch))

            case "$bump" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "::error::Invalid version bump '$bump'; expected patch, minor, or major." >&2
                return 1
                ;;
            esac

            printf 'v%s.%s.%s\n' "$major" "$minor" "$patch"
          }

          ensure_tag() {
            local release_tag="$1"
            local target_sha="$2"
            local existing_sha

            # Re-runs keep an already-created tag stable. A conflicting tag
            # means another release raced us; the caller can calculate the
            # next version and retry.
            if existing_sha=$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" \
              --jq '.object.sha' 2>/dev/null); then
              if [[ "$existing_sha" != "$target_sha" ]]; then
                echo "Tag ${release_tag} already points to ${existing_sha}, expected ${target_sha}." >&2
                return 1
              fi
              echo "Tag ${release_tag} already points to ${target_sha}." >&2
            else
              if gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/git/refs" \
                  -f "ref=refs/tags/${release_tag}" \
                  -f "sha=${target_sha}" >/dev/null; then
                echo "Created tag ${release_tag} at ${target_sha}." >&2
              else
                echo "Could not create tag ${release_tag}; retrying version selection." >&2
                return 1
              fi
            fi
          }

          ensure_next_tag() {
            local bump="$1"
            local attempt release_tag
            for attempt in 1 2 3 4 5; do
              release_tag="$(next_release_tag "$bump")"
              if ensure_tag "$release_tag" "$COMMIT_SHA"; then
                printf '%s\n' "$release_tag"
                return 0
              fi
              echo "Retrying version bump after tag conflict (attempt $attempt of 5)." >&2
            done
            echo "::error::Could not create a unique ${bump} release tag after 5 attempts." >&2
            return 1
          }

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            latest_tag="$(latest_semver_tag)"
            if [[ -n "$latest_tag" ]]; then
              if ! latest_sha="$(resolve_tag_sha "$latest_tag")"; then
                echo "::error::Could not resolve latest semantic release tag '${latest_tag}' to a commit." >&2
                exit 1
              fi
              if [[ "$latest_sha" == "$COMMIT_SHA" ]]; then
                should_release=false
                echo "No new commits since ${latest_tag}; skipping scheduled release."
              fi
            fi

            if [[ "$should_release" == "true" ]]; then
              release_tag="$(ensure_next_tag patch)"
              # Scheduled releases build the immutable default-branch commit,
              # not the moving branch ref.
              checkout_ref="$COMMIT_SHA"
              target_sha="$COMMIT_SHA"
            fi
          elif [[ -n "$INPUT_TAG" ]]; then
            release_tag="$INPUT_TAG"
            # Explicitly requested historical tag. github.sha for a dispatch
            # is the selected branch tip, not this tag's commit, so resolve
            # the tag once to its immutable commit SHA here. git refs can be
            # rewritten, so both installer jobs must check out the resolved
            # SHA (not the tag name) and create-release must target it —
            # otherwise a force-moved tag could make Windows and macOS build
            # different commits, and the release could point elsewhere again.
            if ! resolved_sha="$(resolve_tag_sha "$INPUT_TAG")"; then
              echo "::error::Could not resolve input tag '${INPUT_TAG}' to a commit via the GitHub API." >&2
              exit 1
            fi
            checkout_ref="$resolved_sha"
            target_sha="$resolved_sha"
            echo "Resolved tag ${release_tag} to ${resolved_sha}."
          else
            # A manual dispatch without an explicit tag creates a semantic
            # release tag. Use bump=major or bump=minor for x/y releases;
            # patch is the default and matches a scheduled release.
            release_tag="$(ensure_next_tag "${INPUT_BUMP:-patch}")"
            # Checkout the immutable dispatch-time commit (COMMIT_SHA =
            # github.sha), not the branch ref. The selected branch can advance
            # while installer jobs are queued.
            checkout_ref="$COMMIT_SHA"
            target_sha="$COMMIT_SHA"
          fi

          prerelease=false
          if [[ "${release_tag:-}" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "should_release=$should_release"
            echo "release_tag=${release_tag:-}"
            echo "checkout_ref=${checkout_ref:-}"
            echo "target_sha=${target_sha:-}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          if [[ "$should_release" == "true" ]]; then
            echo "Release tag: $release_tag"
            echo "Checkout ref: $checkout_ref"
            echo "Target SHA: $target_sha"
          fi

  windows-installer:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Normalize version from tag
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          $version = $tag -replace '^v', ''
          if (-not $version) { throw "Could not normalize version from tag '$tag'" }
          # APP_VERSION flows into Inno Setup /D defines, sed substitutions and
          # Info.plist XML. Reject anything outside [A-Za-z0-9.+-] so a tag like
          # 'release/v1.2.3' (contains '/') or one with '&'/'<' can't break the
          # installer build or corrupt the plist.
          if ($version -notmatch '^[A-Za-z0-9.+-]+$') {
            throw "Invalid version '$version' (from tag '$tag'): allowed chars are [A-Za-z0-9.+-]"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Release tag: $tag; normalized version: $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DTXMania.Game/DTXMania.Game.Windows.csproj

      - name: Publish self-contained (win-x64)
        run: >
          dotnet publish DTXMania.Game/DTXMania.Game.Windows.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishReadyToRun=false -p:TieredCompilation=false
          -o ./publish/win

      - name: Verify OFL font license files in publish output
        shell: pwsh
        run: |
          # The SIL Open Font License requires every redistributed copy to
          # include the copyright notice and license text. The .csproj copies
          # them to Licenses/ via None + CopyToOutputDirectory. Fail the build
          # if either file is missing from the publish output.
          $licenses = @(
            'publish/win/Licenses/Orbitron-OFL.txt',
            'publish/win/Licenses/ShareTechMono-OFL.txt'
          )
          foreach ($f in $licenses) {
            if (-not (Test-Path $f)) { throw "Missing OFL license file: $f" }
            Write-Host "Found: $f"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Setup Python for pack validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate CX Neon pack completeness and integrity
        shell: pwsh
        run: |
          # Two complementary gates run before staging (see tools/README.md):
          #
          # 1. skingen/sfxgen validate — integrity: every manifest asset exists
          #    on disk, decodes as an image/audio file, and matches the expected
          #    dimensions. CxNeonPackTests only checks File.Exists, so without
          #    this gate a corrupt or wrong-dimension image would ship and fall
          #    back at runtime.
          # 2. CxNeonPackTests — completeness: every entry in
          #    TexturePath.GetAllTexturePaths() and SoundPath.GetAllSoundPaths()
          #    exists, including manifest-optional-but-code-referenced assets
          #    that skingen validate skips.
          #
          # Both self-skip when the pack is absent (no System/CXNeon/Graphics).
          if (-not (Test-Path 'System/CXNeon/Graphics') -or -not (Test-Path 'System/CXNeon/Sounds')) {
            Write-Host 'CX Neon pack not yet produced — skipping pack validation.'
            exit 0
          }
          # $ErrorActionPreference does not propagate to native commands in
          # pwsh, so a non-zero exit from pip/choco/python/dotnet would be
          # silently swallowed and the step would succeed. Mirror the macOS
          # leg (shell: bash, where `set -e` is the GitHub Actions default)
          # by checking $LASTEXITCODE after every native invocation. Without
          # this, skingen.py validate could exit 1 on a corrupt image while
          # CxNeonPackTests (File.Exists only) passes and a broken asset ships.
          pip install "Pillow>=10,<12"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # sfxgen validate decodes every OGG via ffmpeg. Chocolatey can
          # report success even when its package-feed request times out, so
          # retry and verify that the executable is actually available before
          # running the integrity gate.
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            $chocoInstall = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
            $chocoBin = Join-Path $chocoInstall 'bin'
            $env:PATH = "$chocoBin;$env:PATH"

            for ($attempt = 1; $attempt -le 3 -and -not $ffmpeg; $attempt++) {
              Write-Host "Installing ffmpeg with Chocolatey (attempt $attempt of 3)..."
              choco install ffmpeg -y --no-progress
              $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
              if (-not $ffmpeg -and $attempt -lt 3) {
                Start-Sleep -Seconds (15 * $attempt)
              }
            }
          }
          if (-not $ffmpeg) {
            throw 'ffmpeg is required for CX Neon audio validation but Chocolatey did not make it available on PATH.'
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/skingen/skingen.py validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/sfxgen/sfxgen.py validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test DTXMania.Test/DTXMania.Test.csproj `
            --configuration Release `
            --filter 'FullyQualifiedName~CxNeonPackTests' `
            --verbosity normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage base System skin (flatten CX Neon; fail if pack is missing)
        shell: pwsh
        run: |
          # Flatten the CX Neon pack into the base System layout the
          # ResourceManager expects (Graphics/, Sounds/, Theme.ini at the System
          # root) and pass the staging dir to Inno Setup via SystemSkinDir.
          #
          # Fail-closed: the CX Neon pack is complete and committed, so a missing
          # Graphics/ or Sounds/ is a real regression, not an interim state. The
          # prior ::warning:: fallback shipped repo-root System\ — which contains
          # NX/GITADORA-derived assets the project no longer has rights to
          # redistribute — and was only acceptable while the pack was being
          # produced. Produce the pack via tools/skingen/ and tools/sfxgen/ before
          # cutting a release.
          $dest = Join-Path $PWD 'publish\system-skin'
          if (-not (Test-Path 'System/CXNeon/Graphics') -or -not (Test-Path 'System/CXNeon/Sounds')) {
            $missing = @()
            if (-not (Test-Path 'System/CXNeon/Graphics')) { $missing += 'Graphics' }
            if (-not (Test-Path 'System/CXNeon/Sounds'))   { $missing += 'Sounds' }
            throw "CX Neon pack incomplete ($($missing -join ', ') missing under System/CXNeon/). Refusing to ship repo-root System\ (NX/GITADORA-derived assets). Produce the pack via tools/skingen/ and tools/sfxgen/ before releasing."
          }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path 'System/CXNeon/Graphics' -Destination "$dest/Graphics" -Recurse -Force
          Copy-Item -Path 'System/CXNeon/Sounds'   -Destination "$dest/Sounds"   -Recurse -Force
          Copy-Item -Path 'System/CXNeon/Theme.ini' -Destination "$dest/Theme.ini" -Force
          "SYSTEM_SKIN_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Staged base System skin at: $dest"

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          # SourceDir MUST be absolute: Inno Setup resolves Source: paths relative
          # to the .iss file's directory (installer/windows/), not the ISCC cwd.
          # SystemSkinDir is the staged base System skin (see previous step).
          $sourceDir = Join-Path $PWD "publish\win"
          & $iscc /DMyAppVersion="$env:APP_VERSION" "/DSourceDir=$sourceDir" "/DSystemSkinDir=$env:SYSTEM_SKIN_DIR" "installer\windows\dtxmania.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dtxmania-windows-installer
          path: installer/windows/Output/DTXMania-Setup-${{ env.APP_VERSION }}.exe
          # GITHUB_RUN_ID is stable across reruns (only GITHUB_RUN_ATTEMPT
          # increments), and upload-artifact v4 defaults overwrite to false,
          # so a rerun would 409 on the prior attempt's immutable artifact.
          # Mirror create-release's --clobber rerun handling.
          overwrite: true

  mac-installer:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    # Pin to macos-15 (Apple Silicon / arm64) instead of macos-latest. This
    # job publishes an arm64-only .app bundle and the project-owned FFmpeg
    # builder requires the host architecture, so an x64 runner would fail the
    # native support boundary before publish. macos-15 is arm64,
    # stable, and not deprecated (unlike macos-14, whose deprecation started
    # 2026-07-06). macos-latest is mid-transition to macos-26 (rollout
    # 2026-06-15 through 2026-07-15), so avoid the alias until it settles.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Normalize version from tag
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if [ -z "$version" ]; then echo "Could not normalize version from tag '$tag'" >&2; exit 1; fi
          # APP_VERSION flows into sed substitutions and Info.plist XML. Reject
          # anything outside [A-Za-z0-9.+-] so a tag like 'release/v1.2.3'
          # (contains '/') or one with '&'/'<' can't break the sed delimiter or
          # corrupt the plist.
          if [[ ! "$version" =~ ^[A-Za-z0-9.+-]+$ ]]; then
            echo "Invalid version '$version' (from tag '$tag'): allowed chars are [A-Za-z0-9.+-]" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Release tag: $tag; normalized version: $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DTXMania.Game/DTXMania.Game.Mac.csproj

      - name: Smoke test build-dmg.sh (fast-fail on script regression)
        run: |
          chmod +x installer/macos/build-dmg.sh installer/macos/test-build-dmg.sh
          bash installer/macos/test-build-dmg.sh

      - name: Publish self-contained (osx-arm64)
        run: >
          dotnet publish DTXMania.Game/DTXMania.Game.Mac.csproj
          -c Release -r osx-arm64 --self-contained
          -p:PublishReadyToRun=false -p:TieredCompilation=false
          -o ./publish/mac

      - name: Verify bundled arm64 FFmpeg runtime
        run: |
          runtime="publish/mac/runtimes/osx-arm64/MMTools"
          test -x "$runtime/ffmpeg"
          test -x "$runtime/ffprobe"
          file -b "$runtime/ffmpeg" | grep -qi arm64
          file -b "$runtime/ffprobe" | grep -qi arm64
          test -f publish/mac/Licenses/FFmpeg-LGPL-2.1.txt

      - name: Verify OFL font license files in publish output
        run: |
          # The SIL Open Font License requires every redistributed copy to
          # include the copyright notice and license text. The .csproj copies
          # them to Licenses/ via None + CopyToOutputDirectory. Fail the build
          # if either file is missing from the publish output.
          for f in publish/mac/Licenses/Orbitron-OFL.txt publish/mac/Licenses/ShareTechMono-OFL.txt; do
            if [ ! -f "$f" ]; then echo "::error::Missing OFL license file: $f" >&2; exit 1; fi
            echo "Found: $f"
          done

      - name: Setup Python for pack validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate CX Neon pack completeness and integrity
        run: |
          # Two complementary gates run before staging (see tools/README.md):
          #
          # 1. skingen/sfxgen validate — integrity: every manifest asset exists
          #    on disk, decodes as an image/audio file, and matches the expected
          #    dimensions. CxNeonPackTests only checks File.Exists, so without
          #    this gate a corrupt or wrong-dimension image would ship and fall
          #    back at runtime.
          # 2. CxNeonPackTests — completeness: every entry in
          #    TexturePath.GetAllTexturePaths() and SoundPath.GetAllSoundPaths()
          #    exists, including manifest-optional-but-code-referenced assets
          #    that skingen validate skips.
          #
          # Both self-skip when the pack is absent (no System/CXNeon/Graphics).
          # Mirrors the build-and-test.yml bundle leg.
          if [ ! -d "System/CXNeon/Graphics" ] || [ ! -d "System/CXNeon/Sounds" ]; then
            echo "CX Neon pack not yet produced — skipping pack validation."
            exit 0
          fi
          pip install "Pillow>=10,<12"
          # sfxgen validate decodes every OGG via ffmpeg. The arm64 ffmpeg built
          # earlier for the .app is MP3-only (--disable-everything) and ships to
          # publish/mac/... off PATH, so install a full OGG/Vorbis-capable ffmpeg
          # here. Without it, _decode_ok fail-closes and every sound is rejected.
          brew install ffmpeg
          python tools/skingen/skingen.py validate
          python tools/sfxgen/sfxgen.py validate
          dotnet test DTXMania.Test/DTXMania.Test.Mac.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~CxNeonPackTests' \
            --verbosity normal

      - name: Stage base System skin (flatten CX Neon; fail if pack is missing)
        run: |
          # Flatten the CX Neon pack into the base System layout the
          # ResourceManager expects (Graphics/, Sounds/, Theme.ini at the System
          # root) and pass the staging dir to build-dmg.sh.
          #
          # Fail-closed: the CX Neon pack is complete and committed, so a missing
          # Graphics/ or Sounds/ is a real regression, not an interim state. The
          # prior ::warning:: fallback shipped repo-root System/ — which contains
          # NX/GITADORA-derived assets the project no longer has rights to
          # redistribute — and was only acceptable while the pack was being
          # produced. Produce the pack via tools/skingen/ and tools/sfxgen/ before
          # cutting a release. Mirrors the windows-installer leg.
          if [ ! -d "System/CXNeon/Graphics" ] || [ ! -d "System/CXNeon/Sounds" ]; then
            missing=""
            [ ! -d "System/CXNeon/Graphics" ] && missing="Graphics"
            [ ! -d "System/CXNeon/Sounds" ]   && missing="${missing:+$missing, }Sounds"
            echo "::error::CX Neon pack incomplete (${missing:-unknown} missing under System/CXNeon/). Refusing to ship repo-root System/ (NX/GITADORA-derived assets). Produce the pack via tools/skingen/ and tools/sfxgen/ before releasing." >&2
            exit 1
          fi
          dest="$PWD/publish/system-skin"
          mkdir -p "$dest"
          cp -R System/CXNeon/Graphics "$dest/Graphics"
          cp -R System/CXNeon/Sounds   "$dest/Sounds"
          cp System/CXNeon/Theme.ini   "$dest/Theme.ini"
          echo "SYSTEM_SKIN_DIR=$dest" >> "$GITHUB_ENV"
          echo "Staged base System skin at: $dest"

      - name: Build .app bundle and DMG
        run: |
          test -x ./publish/mac/runtimes/osx-arm64/MMTools/ffmpeg
          test -x ./publish/mac/runtimes/osx-arm64/MMTools/ffprobe
          bash installer/macos/build-dmg.sh \
            ./publish/mac \
            "$SYSTEM_SKIN_DIR" \
            "$APP_VERSION" \
            DTXMania.Game/Icon.ico \
            ./output

      - name: Verify bundled FFmpeg runtime in .app
        run: |
          runtime="output/DTXMania.app/Contents/MacOS/runtimes/osx-arm64/MMTools"
          test -x "$runtime/ffmpeg"
          test -x "$runtime/ffprobe"
          file -b "$runtime/ffmpeg" | grep -qi arm64
          file -b "$runtime/ffprobe" | grep -qi arm64
          test -f output/DTXMania.app/Contents/MacOS/Licenses/FFmpeg-LGPL-2.1.txt

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dtxmania-macos-dmg
          path: output/DTXMania-${{ env.APP_VERSION }}-arm64.dmg
          overwrite: true # see windows-installer upload note; same rerun concern

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - windows-installer
      - mac-installer
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dtxmania-windows-installer
          path: release-assets

      - name: Download macOS DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dtxmania-macos-dmg
          path: release-assets

      - name: Verify release tag still resolves to build commit
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_TOKEN authenticates but does not select a repository for the
          # `gh api` calls below. Set GH_REPO explicitly even though this job
          # checked out the immutable source commit for provenance preparation.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          TARGET_SHA: ${{ needs.prepare-release.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # git refs can be rewritten. Before publishing, confirm the release
          # tag still resolves to the commit the artifacts were built from, so
          # a force-push to the tag while the installer jobs were queued can't
          # publish a release whose binaries came from a different commit.
          #
          # Every release path has a tag by this point: scheduled runs and
          # manual bump dispatches create one in prepare-release, while
          # explicit-tag dispatches resolve an existing one. A missing tag is
          # therefore an integrity failure, not an expected state. A missing
          # tag is only acceptable when it is an actual HTTP 404; an auth,
          # rate-limit, network, or server failure must not be treated as "tag
          # does not exist", or the check becomes fail-open.
          # Qualify with tags/ so the commits endpoint resolves the tag ref
          # unambiguously. A bare short name is also accepted, but when a
          # branch and tag share the same name Git resolves refs/heads/
          # before refs/tags/, so the lookup would silently resolve the
          # branch instead of the tag. The verification would then compare
          # the branch SHA against TARGET_SHA (also resolved from the
          # branch in prepare-release) and pass, while gh release create
          # --target is ignored for an existing tag — shipping assets built
          # from the branch commit under a release tagged at a different one.
          qualified_tag="tags/${RELEASE_TAG}"
          encoded_ref="$(jq -rn --arg v "$qualified_tag" '$v | @uri')"
          # Use -i so we can read the HTTP status from the response even on a
          # non-2xx, distinguishing a real 404 from auth/rate-limit/server
          # errors. gh api still exits non-zero on 4xx/5xx, so swallow its
          # exit status and parse the captured output.
          response="$(gh api -i \
              -H 'Accept: application/vnd.github.sha' \
              "repos/${GH_REPO}/commits/${encoded_ref}" 2>/dev/null)" || true
          # Status line is the first line: "HTTP/2.0 200 OK". Strip any
          # trailing CR so a CRLF blank-line separator is detectable later.
          status="$(printf '%s\n' "$response" | sed 's/\r$//' | head -n1 | awk '{print $2}')"

          case "$status" in
            200)
              # Body is the bare SHA after the blank line separating headers
              # from the body. Print lines following the first blank line and
              # take the last non-empty one as the SHA.
              current_sha="$(printf '%s\n' "$response" | sed 's/\r$//' \
                | awk 'NF==0{blank=1;next} blank{print}' \
                | tail -n1 | tr -d '[:space:]')"
              if [[ "$current_sha" != "$TARGET_SHA" ]]; then
                echo "::error::Tag $RELEASE_TAG now resolves to $current_sha, expected $TARGET_SHA. Refusing to publish artifacts built from $TARGET_SHA." >&2
                exit 1
              fi
              echo "Tag $RELEASE_TAG still points at $TARGET_SHA."
              ;;
            404)
              echo "::error::Tag $RELEASE_TAG does not exist but is required for this release path. Refusing to publish without verifying tag-to-build relationship." >&2
              exit 1
              ;;
            *)
              echo "::error::Unable to verify tag $RELEASE_TAG: GitHub API returned HTTP ${status:-<no response>}. Refusing to publish without verifying tag-to-build relationship." >&2
              exit 1
              ;;
          esac

      - name: Prepare FFmpeg source and provenance assets
        env:
          TARGET_SHA: ${{ needs.prepare-release.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          builder_script="tools/ffmpeg/macos-arm64/build-runtime.sh"
          if [ ! -f "$builder_script" ]; then
            echo "::error::Missing FFmpeg builder script: $builder_script" >&2
            exit 1
          fi

          extract_builder_assignment() {
            local key="$1"
            local value
            if ! value="$(awk -v key="$key" '
              index($0, key "=\"") == 1 && substr($0, length($0), 1) == "\"" {
                candidate=substr($0, length(key) + 3, length($0) - length(key) - 3)
                count++
                value=candidate
              }
              END {
                if (count != 1 || value == "") {
                  exit 1
                }
                print value
              }
            ' "$builder_script")"; then
              echo "::error::Expected exactly one non-empty ${key}=\"...\" assignment in $builder_script." >&2
              exit 1
            fi
            printf '%s\n' "$value"
          }

          ffmpeg_version="$(extract_builder_assignment FFMPEG_VERSION)"
          ffmpeg_source_sha256="$(extract_builder_assignment FFMPEG_TARBALL_SHA256)"
          ffmpeg_source_url_template="$(extract_builder_assignment FFMPEG_URL)"
          ffmpeg_source_url="${ffmpeg_source_url_template//\$\{FFMPEG_VERSION\}/$ffmpeg_version}"

          if [[ ! "$ffmpeg_version" =~ ^[0-9]+([.][0-9]+)+$ ]]; then
            echo "::error::Invalid FFmpeg version parsed from $builder_script: $ffmpeg_version" >&2
            exit 1
          fi
          if [[ ! "$ffmpeg_source_sha256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Invalid FFmpeg source SHA-256 parsed from $builder_script." >&2
            exit 1
          fi

          source_archive="${ffmpeg_source_url##*/}"
          expected_archive="ffmpeg-${ffmpeg_version}.tar.xz"
          if [ -z "$ffmpeg_version" ] || [ "$source_archive" != "$expected_archive" ]; then
            echo "::error::FFmpeg source URL basename '$source_archive' does not match parsed version '$ffmpeg_version'." >&2
            exit 1
          fi
          if [ "$ffmpeg_source_url" != "https://ffmpeg.org/releases/$source_archive" ]; then
            echo "::error::FFmpeg source URL is not the expected immutable ffmpeg.org release archive: $ffmpeg_source_url" >&2
            exit 1
          fi

          # The source archive is used without patching. Refuse to publish a
          # provenance claim if the builder ever grows a source-patch command.
          if grep -Eq '(^|[[:space:];])(patch|git[[:space:]]+apply)([[:space:]]|$)' "$builder_script"; then
            echo "::error::The FFmpeg builder contains a source-patch command; release provenance requires an unpatched upstream archive." >&2
            exit 1
          fi

          source_asset="release-assets/$source_archive"
          echo "Downloading FFmpeg source archive from $ffmpeg_source_url"
          curl -fsSL --retry 3 --retry-delay 2 "$ffmpeg_source_url" -o "$source_asset"
          printf '%s  %s\n' "$ffmpeg_source_sha256" "$source_asset" | shasum -a 256 -c -

          source_root="ffmpeg-${ffmpeg_version}"
          archive_roots="$(tar -tJf "$source_asset" | awk -F/ 'NF { print $1 }' | sort -u)"
          if [ "$archive_roots" != "$source_root" ]; then
            echo "::error::Unexpected FFmpeg source archive tree (expected only $source_root, got: $archive_roots)." >&2
            exit 1
          fi
          tar -tJf "$source_asset" "$source_root/COPYING.LGPLv2.1" >/dev/null

          source_stem="${source_archive%.tar.xz}"
          provenance_asset="${source_stem}-provenance.txt"
          builder_asset="${source_stem}-build-runtime.sh"
          builder_sha256="$(shasum -a 256 "$builder_script" | awk '{print $1}')"
          cp "$builder_script" "release-assets/$builder_asset"
          printf '%s  %s\n' "$builder_sha256" "release-assets/$builder_asset" | shasum -a 256 -c -

          cat > "release-assets/$provenance_asset" <<EOF
          FFmpeg source provenance
          ========================
          FFmpeg version: $ffmpeg_version
          Source archive: $source_archive
          Source URL: $ffmpeg_source_url
          Source SHA-256: $ffmpeg_source_sha256
          Release target commit: $TARGET_SHA
          Builder script: $builder_script
          Builder script asset: $builder_asset
          Builder script SHA-256: $builder_sha256
          Source patch status: none (the builder contains no patch or git apply command)
          Build/configure surface: see the exact builder script asset above; it contains the complete configure and make commands used for the bundled runtime.
          EOF

          {
            echo "FFMPEG_VERSION=$ffmpeg_version"
            echo "FFMPEG_SOURCE_ARCHIVE=$source_archive"
            echo "FFMPEG_PROVENANCE_ASSET=$provenance_asset"
            echo "FFMPEG_BUILDER_ASSET=$builder_asset"
          } >> "$GITHUB_ENV"

      - name: Create GitHub release with build assets
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_TOKEN authenticates but does not select a repository for the
          # `gh` release view/upload/create commands below. Set GH_REPO
          # explicitly even though this job checked out the immutable source
          # commit for provenance preparation.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
          TARGET_SHA: ${{ needs.prepare-release.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Match fail_on_unmatched_files: true — bash's default glob expands
          # to the literal pattern when nothing matches (nullglob is off), so
          # enable nullglob temporarily to get an empty array and check it.
          shopt -s nullglob
          assets=(release-assets/*)
          shopt -u nullglob
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No release assets found in release-assets/" >&2
            exit 1
          fi

          prerelease_args=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi

          # Re-runs of a failed create-release job may encounter a release
          # that already exists for the tag. softprops/action-gh-release
          # updated it in place; replicate that by uploading assets with
          # --clobber instead of erroring on the existing release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading assets."
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "DTXManiaCX $RELEASE_TAG" \
              --generate-notes \
              "${prerelease_args[@]}" \
              "${assets[@]}"
          fi

          notice_start='<!-- DTXMANIACX_FFMPEG_SOURCE_NOTICE_START -->'
          notice_end='<!-- DTXMANIACX_FFMPEG_SOURCE_NOTICE_END -->'
          source_base_url="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}"
          body_file="$(mktemp)"
          notice_file="$(mktemp)"
          updated_body_file="$(mktemp)"
          trap 'rm -f "$body_file" "$notice_file" "$updated_body_file"' EXIT

          gh release view "$RELEASE_TAG" --json body --jq '.body // ""' > "$body_file"
          cat > "$notice_file" <<EOF
          $notice_start
          FFmpeg/LGPL source notice: this release bundles FFmpeg ${FFMPEG_VERSION} under LGPL-2.1 for the native macOS runtime. The exact upstream source archive is [${FFMPEG_SOURCE_ARCHIVE}](${source_base_url}/${FFMPEG_SOURCE_ARCHIVE}); build provenance is [${FFMPEG_PROVENANCE_ASSET}](${source_base_url}/${FFMPEG_PROVENANCE_ASSET}), including the exact builder/configure script [${FFMPEG_BUILDER_ASSET}](${source_base_url}/${FFMPEG_BUILDER_ASSET}).
          $notice_end
          EOF

          python3 - "$body_file" "$notice_file" "$updated_body_file" "$notice_start" "$notice_end" <<'PY'
          import sys
          from pathlib import Path

          body_path, notice_path, updated_path, start, end = sys.argv[1:]
          body = Path(body_path).read_text()
          notice = Path(notice_path).read_text()
          start_count = body.count(start)
          end_count = body.count(end)

          if start_count == 0:
              updated = notice + ("\n" if body else "") + body
          elif start_count == 1 and end_count == 1:
              start_index = body.index(start)
              end_index = body.index(end, start_index) + len(end)
              updated = body[:start_index] + notice.rstrip("\n") + body[end_index:]
          else:
              raise SystemExit("Malformed or duplicated FFmpeg source notice markers in the existing release body.")

          Path(updated_path).write_text(updated)
          PY

          if ! cmp -s "$body_file" "$updated_body_file"; then
            gh release edit "$RELEASE_TAG" --notes-file "$updated_body_file"
          fi
