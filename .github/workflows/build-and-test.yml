name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        # Pinned to an exact SDK: floating '10.0.x' resolves via aka.ms channel
        # links, which currently redirect to a storage origin that denies public
        # access (dotnet/core#10660). An exact version makes dotnet-install
        # build the URL directly against builds.dotnet.microsoft.com.
        dotnet-version: '10.0.403'

    - name: Pin resolved SDK
      shell: bash
      run: |
        # The dotnet-version input installs the SDK but does not force later
        # dotnet commands to select it — without a global.json the CLI picks
        # the newest SDK on the runner. CI-only pin (delete with the
        # dotnet-version pin once aka.ms is fixed).
        printf '{ "sdk": { "version": "10.0.403", "rollForward": "disable" } }\n' > global.json
        dotnet --version

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore DTXMania.Game/DTXMania.Game.Windows.csproj

    - name: Build Windows project
      run: dotnet build DTXMania.Game/DTXMania.Game.Windows.csproj --configuration Debug --no-restore

    - name: Compile Windows installer script
      shell: pwsh
      run: |
        choco install innosetup --no-progress -y
        if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup" }

        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

        # Compile against tiny throwaway payloads. This exercises the real Inno
        # parser and [Code] compiler without duplicating the release publish.
        # The payload mirrors the publish output's bundled System/ skin so the
        # single recursive [Files] entry is the only skin source.
        $smokeRoot = Join-Path $env:RUNNER_TEMP "dtxmania-installer-smoke"
        $sourceDir = Join-Path $smokeRoot "app"
        $systemDir = Join-Path $sourceDir "System"
        New-Item -ItemType Directory -Force -Path $systemDir | Out-Null
        Set-Content -Path (Join-Path $sourceDir "payload.txt") -Value "installer smoke"
        Set-Content -Path (Join-Path $systemDir "Theme.ini") -Value "[Theme]"

        & $iscc "/DMyAppVersion=0.0.0-ci" "/DSourceDir=$sourceDir" "installer\windows\dtxmania.iss"
        if ($LASTEXITCODE -ne 0) { throw "Windows installer script failed to compile" }

    - name: Run tests on Windows
      env:
        ALSOFT_DRIVERS: 'null'
      run: dotnet test DTXMania.Test/DTXMania.Test.csproj --configuration Debug --verbosity normal --logger trx --results-directory ./TestResults /p:CollectCoverage=true /p:CoverletOutput=./TestResults/Coverage/ /p:CoverletOutputFormat=cobertura /p:IncludeTestAssembly=false /p:Exclude="[DTXMania.Test*]*"

    - name: Run Automation tests on Windows
      run: dotnet test DTXMania.Automation.Tests/DTXMania.Automation.Tests.csproj --configuration Debug --verbosity normal --logger trx --results-directory ./TestResults/Automation

    - name: Run Video recorder tests on Windows
      run: dotnet test DTXMania.VideoRecorder.Tests/DTXMania.VideoRecorder.Tests.csproj --configuration Debug --verbosity normal --logger trx --results-directory ./TestResults/VideoRecorder

    - name: Locate coverage report
      shell: pwsh
      if: always()
      run: |
        $candidatePaths = @(
          "TestResults/coverage.cobertura.xml",
          "TestResults/Coverage/coverage.cobertura.xml",
          "DTXMania.Test/TestResults/coverage.cobertura.xml",
          "DTXMania.Test/TestResults/Coverage/coverage.cobertura.xml"
        )

        $coveragePath = $candidatePaths |
          ForEach-Object { Join-Path $PWD $_ } |
          Where-Object { Test-Path $_ } |
          Select-Object -First 1

        if (-not $coveragePath) {
          # Fail closed: without the report the project coverage gate silently
          # disappears, which is how the artifact gap went unnoticed before.
          Write-Error "coverage.cobertura.xml not found in TestResults; the Windows coverage gate cannot run."
          exit 1
        }

        # Coverlet writes relative to DTXMania.Test, so copy into ./TestResults/Coverage/
        # so Upload test results can keep a single ./TestResults root without moving
        # the artifact root up to the workspace directory.
        $artifactCoverageDir = Join-Path $PWD "TestResults/Coverage"
        $artifactCoveragePath = Join-Path $artifactCoverageDir "coverage.cobertura.xml"
        if ([System.IO.Path]::GetFullPath($coveragePath) -ne [System.IO.Path]::GetFullPath($artifactCoveragePath)) {
          New-Item -ItemType Directory -Force -Path $artifactCoverageDir | Out-Null
          Copy-Item -Path $coveragePath -Destination $artifactCoveragePath -Force
          $coveragePath = $artifactCoveragePath
        }

        "CODECOV_FILE=$coveragePath" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Host "Coverage report found: $coveragePath"

    - name: Upload test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: test-results-windows
        path: ./TestResults

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      if: always() && env.CODECOV_FILE != ''
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ env.CODECOV_FILE }}
        flags: unit,windows
        # Dependabot and fork PRs do not receive Actions secrets, so keep the upload
        # strict for push and same-repo maintainer PRs without breaking Dependabot.
        fail_ci_if_error: ${{ github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.fork == false) }}
        verbose: true

    - name: Setup Python for tool tests
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Run skingen/sfxgen/practicegen tool unit tests
      shell: bash
      run: |
        # Mirror the macOS job: the CX Neon asset pipelines (tools/skingen,
        # tools/sfxgen) ship Python unit tests that guard manifest/inventory
        # consistency. Running them on Windows too catches platform-specific
        # path drift (backslash vs forward slash) and ensures the TexturePath/
        # SoundPath constants stay in sync with the tool manifests on both
        # platforms. skingen tests require Pillow; sfxgen is stdlib-only.
        pip install "Pillow>=10,<12"
        python -m unittest discover -s tools/skingen -p "test_*.py" -v
        python -m unittest discover -s tools/sfxgen -p "test_*.py" -v
        python -m unittest discover -s tools/practicegen -p "test_*.py" -v

    - name: Validate committed CX Neon pack (integrity gate)
      shell: bash
      run: |
        # skingen/sfxgen `validate` decode every committed System asset and
        # check it matches the manifest dimensions / decodes as a real
        # image/audio file. CxNeonPackTests (run above) only checks File.Exists,
        # so without this gate a corrupt or wrong-dimension image would pass CI
        # and ship — exactly the gap the release.yml integrity gate closes, but
        # regular CI never ran it. The pack is committed, so a missing
        # Graphics/ or Sounds/ is a regression, not an interim state —
        # fail-closed (no self-skip), matching release.yml.
        if [ ! -d "System/Graphics" ] || [ ! -d "System/Sounds" ]; then
          echo "::error::CX Neon pack missing from repo (System/Graphics or Sounds). Run tools/skingen/ and tools/sfxgen/ to produce it before merging." >&2
          exit 1
        fi
        # sfxgen validate decodes every OGG via ffmpeg; install a full
        # OGG/Vorbis-capable build so _decode_ok doesn't fail-close every
        # sound and false-positive the gate. brew/choco exit 0 when the
        # package is already installed, so this is a no-op on cached runners.
        if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; fi
        if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; fi
        python tools/skingen/skingen.py validate
        python tools/sfxgen/sfxgen.py validate

  build-and-test-macos:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: macos-15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        # Pinned: floating '10.0.x' resolves via broken aka.ms channel links
        # (dotnet/core#10660). Revert to '10.0.x' once aka.ms is fixed.
        dotnet-version: '10.0.403'

    - name: Pin resolved SDK
      shell: bash
      run: |
        # dotnet-version installs the SDK but does not force later dotnet
        # commands to select it — without a global.json the CLI picks the
        # newest SDK on the runner. CI-only pin (delete with the
        # dotnet-version pin once aka.ms is fixed).
        printf '{ "sdk": { "version": "10.0.403", "rollForward": "disable" } }\n' > global.json
        dotnet --version

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Cache native FFmpeg runtime
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/DTXManiaCX/ffmpeg
        key: macos-arm64-ffmpeg-${{ hashFiles('tools/ffmpeg/macos-arm64/build-runtime.sh') }}
    
    - name: Restore dependencies
      run: dotnet restore DTXMania.Test/DTXMania.Test.csproj

    - name: Build Game Mac project
      run: dotnet build DTXMania.Game/DTXMania.Game.Mac.csproj --configuration Debug --no-restore

    - name: Verify Game bundled FFmpeg runtime
      shell: bash
      run: |
        runtime="DTXMania.Game/bin/Debug/net10.0/runtimes/osx-arm64/MMTools"
        for bin in "$runtime/ffmpeg" "$runtime/ffprobe"; do
          test -x "$bin"
          file -b "$bin" | grep -qi arm64
        done

    - name: Build unit test project
      run: dotnet build DTXMania.Test/DTXMania.Test.csproj --configuration Debug --no-restore

    - name: Verify unit test project bundled FFmpeg runtime
      shell: bash
      run: |
        runtime="DTXMania.Test/bin/Debug/net10.0/runtimes/osx-arm64/MMTools"
        for bin in "$runtime/ffmpeg" "$runtime/ffprobe"; do
          test -x "$bin"
          file -b "$bin" | grep -qi arm64
        done

    - name: Run focused bundled Audio tests on macOS
      env:
        ALSOFT_DRIVERS: 'null'
      run: >
        dotnet test DTXMania.Test/DTXMania.Test.csproj
        --configuration Debug
        --no-build
        --filter "FullyQualifiedName~FfmpegAudioVariantProcessorTests|FullyQualifiedName~FfmpegBundledRuntimeTests|FullyQualifiedName~ManagedSoundTests"
        --verbosity normal

    - name: Run tests on macOS
      env:
        ALSOFT_DRIVERS: 'null'
      run: dotnet test DTXMania.Test/DTXMania.Test.csproj --configuration Debug --no-build --verbosity normal --results-directory ./TestResults --logger "trx;LogFileName=unit-macos.trx"

    - name: Verify macOS unit tests executed
      shell: bash
      run: |
        # dotnet test exits 0 when zero tests are discovered or executed.
        trx="./TestResults/unit-macos.trx"
        if [ ! -s "$trx" ]; then
          echo "::error::macOS unit test TRX report missing or empty: $trx" >&2
          exit 1
        fi
        python3 - "$trx" <<'EOF'
        import sys
        import xml.etree.ElementTree as ET

        tree = ET.parse(sys.argv[1])
        counters = next(
            (el for el in tree.getroot().iter() if el.tag.endswith("Counters")),
            None,
        )
        if counters is None:
            sys.exit("TRX report has no Counters element.")

        total = int(counters.attrib.get("total", "0"))
        executed = int(counters.attrib.get("executed", "0"))
        passed = int(counters.attrib.get("passed", "0"))
        failed = int(counters.attrib.get("failed", "0"))
        error = int(counters.attrib.get("error", "0"))
        print(f"macOS unit TRX counters: total={total}, executed={executed}, passed={passed}, failed={failed}, error={error}")
        if total <= 0 or executed <= 0 or passed <= 0 or failed > 0 or error > 0:
            sys.exit(
                f"Expected non-zero passing unit tests without failures "
                f"(total={total}, executed={executed}, passed={passed}, failed={failed}, error={error})."
            )
        EOF

    - name: Run Automation tests on macOS
      run: dotnet test DTXMania.Automation.Tests/DTXMania.Automation.Tests.csproj --configuration Debug --verbosity normal --logger trx --results-directory ./TestResults/Automation

    - name: Run Video recorder tests on macOS
      run: dotnet test DTXMania.VideoRecorder.Tests/DTXMania.VideoRecorder.Tests.csproj --configuration Debug --verbosity normal --logger trx --results-directory ./TestResults/VideoRecorder

    - name: Run prepared-chart audio E2E on macOS
      env:
        ALSOFT_DRIVERS: 'null'
        DTXMANIA_E2E_GAME_PROJECT: DTXMania.Game/DTXMania.Game.Mac.csproj
        DTXMANIA_E2E_ARTIFACT_ROOT: TestResults/e2e-audio
      run: dotnet test DTXMania.E2E/DTXMania.E2E.csproj --configuration Debug --verbosity normal --logger trx --results-directory ./TestResults/e2e-audio --filter "Category=AudioE2E"

    - name: Upload test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: test-results-macos
        path: ./TestResults

    - name: Setup Python for tool tests
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Run skingen/sfxgen/practicegen tool unit tests
      shell: bash
      run: |
        # The CX Neon asset pipelines (tools/skingen, tools/sfxgen) ship Python
        # unit tests that guard manifest/inventory consistency. Run them on every
        # push/PR so drift between SoundPath/TexturePath constants and the tool
        # manifests is caught here rather than only in the manual release job.
        # skingen tests require Pillow; sfxgen is stdlib-only.
        pip install "Pillow>=10,<12"
        python -m unittest discover -s tools/skingen -p "test_*.py" -v
        python -m unittest discover -s tools/sfxgen -p "test_*.py" -v
        python -m unittest discover -s tools/practicegen -p "test_*.py" -v

    - name: Validate committed CX Neon pack (integrity gate)
      shell: bash
      run: |
        # Mirror the Windows leg: run skingen/sfxgen `validate` against the
        # committed System pack so a corrupt or wrong-dimension asset fails CI
        # here, not just in the manual release job. CxNeonPackTests (run above)
        # only checks File.Exists. Fail-closed if the pack is missing — it is
        # committed, so absence is a regression.
        if [ ! -d "System/Graphics" ] || [ ! -d "System/Sounds" ]; then
          echo "::error::CX Neon pack missing from repo (System/Graphics or Sounds). Run tools/skingen/ and tools/sfxgen/ to produce it before merging." >&2
          exit 1
        fi
        # sfxgen validate decodes every OGG via ffmpeg; install a full
        # OGG/Vorbis-capable build so _decode_ok doesn't fail-close every
        # sound and false-positive the gate. brew exits 0 when already installed.
        brew install ffmpeg
        python tools/skingen/skingen.py validate
        python tools/sfxgen/sfxgen.py validate

  gameplay-e2e-windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        # Pinned: floating '10.0.x' resolves via broken aka.ms channel links
        # (dotnet/core#10660). Revert to '10.0.x' once aka.ms is fixed.
        dotnet-version: '10.0.403'

    - name: Pin resolved SDK
      shell: bash
      run: |
        # dotnet-version installs the SDK but does not force later dotnet
        # commands to select it — without a global.json the CLI picks the
        # newest SDK on the runner. CI-only pin (delete with the
        # dotnet-version pin once aka.ms is fixed).
        printf '{ "sdk": { "version": "10.0.403", "rollForward": "disable" } }\n' > global.json
        dotnet --version

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-e2e-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Windows game
      run: dotnet restore DTXMania.Game/DTXMania.Game.Windows.csproj

    - name: Restore E2E project
      run: dotnet restore DTXMania.E2E/DTXMania.E2E.csproj --runtime win-x64

    - name: Build Windows game
      run: dotnet build DTXMania.Game/DTXMania.Game.Windows.csproj --configuration Debug --no-restore

    - name: Run gameplay E2E smoke
      env:
        ALSOFT_DRIVERS: 'null'
        DTXMANIA_E2E_GAME_PROJECT: DTXMania.Game/DTXMania.Game.Windows.csproj
        DTXMANIA_E2E_ARTIFACT_ROOT: TestResults/e2e
      run: dotnet test DTXMania.E2E/DTXMania.E2E.csproj --configuration Debug --verbosity normal --logger trx --results-directory ./TestResults/e2e --filter "Category=E2E"

    - name: Verify HPA-797 screenshot tour
      shell: bash
      run: |
        tour=TestResults/e2e/hpa-797-tour
        required=(
          01-title.png
          02-config.png
          03-drum-config.png
          04-song-select.png
          05-lanes-performance.png
          06-result.png
          07-tab-performance.png
        )
        # Required captures already validate PNG integrity in the tests; this
        # checks the uploaded artifact really contains all seven distinct files.
        for name in "${required[@]}"; do
          file="$tour/$name"
          if [ ! -s "$file" ]; then
            echo "::error::Missing or empty HPA-797 tour screenshot: $file" >&2
            exit 1
          fi
          if [ "$(head -c 8 "$file" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
            echo "::error::HPA-797 tour screenshot is not a PNG: $file" >&2
            exit 1
          fi
          if [ "$(tail -c 12 "$file" | od -An -tx1 | tr -d ' \n')" != "0000000049454e44ae426082" ]; then
            echo "::error::HPA-797 tour screenshot is incomplete (no trailing IEND): $file" >&2
            exit 1
          fi
        done
        png_count=$(find "$tour" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')
        if [ "$png_count" -ne "${#required[@]}" ]; then
          echo "::error::Expected ${#required[@]} HPA-797 tour screenshots, found $png_count in $tour" >&2
          exit 1
        fi

    - name: Run E2E support tests
      run: dotnet test DTXMania.E2E/DTXMania.E2E.csproj --configuration Debug --verbosity normal --logger trx --results-directory ./TestResults/e2e-support --filter "Category=E2E-Support"

    - name: Upload gameplay E2E artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: gameplay-e2e-windows
        path: ./TestResults/e2e

  build-artifacts:
    runs-on: ${{ matrix.os }}
    needs: [build-and-test-windows, build-and-test-macos]
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: windows-latest
            project: DTXMania.Game/DTXMania.Game.Windows.csproj
            output: windows
            artifact: dtxmania-windows
          - os: macos-15
            project: DTXMania.Game/DTXMania.Game.Mac.csproj
            output: macos
            artifact: dtxmania-macos
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        # Pinned: floating '10.0.x' resolves via broken aka.ms channel links
        # (dotnet/core#10660). Revert to '10.0.x' once aka.ms is fixed.
        dotnet-version: '10.0.403'

    - name: Pin resolved SDK
      shell: bash
      run: |
        # dotnet-version installs the SDK but does not force later dotnet
        # commands to select it — without a global.json the CLI picks the
        # newest SDK on the runner. CI-only pin (delete with the
        # dotnet-version pin once aka.ms is fixed).
        printf '{ "sdk": { "version": "10.0.403", "rollForward": "disable" } }\n' > global.json
        dotnet --version

    - name: Cache native FFmpeg runtime (macOS)
      if: runner.os == 'macOS'
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/DTXManiaCX/ffmpeg
        key: macos-arm64-ffmpeg-${{ hashFiles('tools/ffmpeg/macos-arm64/build-runtime.sh') }}

    - name: Restore dependencies
      run: dotnet restore ${{ matrix.project }}
    
    - name: Build Release
      run: dotnet build ${{ matrix.project }} --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish ${{ matrix.project }} --configuration Release --output ./publish/${{ matrix.output }} --no-restore --self-contained false

    - name: Setup Python for pack validation
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Validate source and published System skin
      shell: bash
      run: |
        # Source pack: skingen/sfxgen `validate` decode every committed System
        # asset and check it matches the manifest dimensions. Fail-closed: the
        # pack is committed, so a missing Graphics/ or Sounds/ is a regression,
        # not an interim state.
        if [ ! -d "System/Graphics" ] || [ ! -d "System/Sounds" ]; then
          echo "::error::System skin missing from repo (System/Graphics or Sounds). Run tools/skingen/ and tools/sfxgen/ to produce it before merging." >&2
          exit 1
        fi
        # Published pack: publish now supplies System/ directly (both game
        # projects copy it), so validate the artifact users actually receive.
        # No self-skip: a missing published skin means the MSBuild copy items
        # broke.
        system_dir="./publish/${{ matrix.output }}/System"
        for required in Theme.ini Graphics Sounds; do
          if [ ! -e "$system_dir/$required" ]; then
            echo "::error::Published System skin is incomplete (missing $required under $system_dir)." >&2
            exit 1
          fi
        done
        pip install "Pillow>=10,<12"
        # sfxgen validate decodes every OGG via ffmpeg, which is not guaranteed
        # to be on PATH on either runner. Install a full OGG/Vorbis-capable build
        # before running it so _decode_ok doesn't fail-close every sound.
        if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; fi
        if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; fi
        python tools/skingen/skingen.py validate
        python tools/sfxgen/sfxgen.py validate
        # The published copy is produced by CopyToOutput/ToPublish items, so
        # byte equality with the validated source pack is the complete check.
        # Decoding every asset a second time adds no coverage. Compare the
        # published payload only: SystemSkin.props ships Theme.ini, Graphics/,
        # and Sounds/, so diffing the whole System/ directory would fail on
        # source-only files like README.md that never ship.
        for entry in Theme.ini Graphics Sounds; do
          if ! diff -r "System/$entry" "$system_dir/$entry"; then
            echo "::error::Published System skin differs from the validated source pack ($entry)." >&2
            exit 1
          fi
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ matrix.artifact }}-${{ github.sha }}
        path: ./publish/${{ matrix.output }}
