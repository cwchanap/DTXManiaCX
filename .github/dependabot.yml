version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 5
    # Runtime-coupled package majors are TFM-coupled (EF Core, Microsoft.Extensions.*,
    # System.Drawing.Common): the N+1 packages are built for net(N+1).0, so a major
    # bump cannot merge until the repo retargets. Block majors to keep Dependabot from
    # proposing them; minor/patch still group-update.
    # Revisit when the repo moves to the next target framework.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Tools"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Drawing.Common"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Configuration"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Logging"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Logging.Console"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
