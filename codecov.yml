coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        target: 85%
        threshold: 0%
        informational: false
        if_not_found: failure

# NotationStripRenderer's draw bodies need a real GraphicsDevice that headless
# CI cannot create (DesktopGL/SDL), so they can never contribute patch coverage.
# This scoped exclusion keeps the mandatory 85% patch gate for all other code;
# the renderer's ctor/dispose/Draw-guard contract still runs in CI tests.
ignore:
  - "DTXMania.Game/Lib/Stage/Performance/NotationStripRenderer.cs"
