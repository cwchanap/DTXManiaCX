coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        # Advisory: headless CI cannot execute the notation renderer's
        # device-only draw path, so it cannot satisfy a new-code gate.
        target: 85%
        threshold: 0%
        informational: true
        if_not_found: failure
