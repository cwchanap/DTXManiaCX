coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        target: 85%
        threshold: 0%
        # GPU-bound draw paths (e.g. HPA-410 NotationStripRenderer) cannot
        # execute on headless CI runners, so patch coverage is reported but
        # does not fail; the project gate above still enforces 85%.
        informational: true
        if_not_found: failure
